<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Your Shipment | Super Air Express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f6f8, #e9edf2);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 520px;
      margin: 40px auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .tagline {
      color: #555;
      font-size: 14px;
      margin-top: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #0078d7;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }

    #result {
      margin-top: 25px;
      font-size: 14px;
    }

    .status-box {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #0078d7;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .history li {
      margin-bottom: 8px;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="brand">Super Air Express</div>
      <div class="tagline">Delivering Trust, On Time 🚚</div>
    </div>

    <input type="text" id="trackingId" placeholder="Enter Tracking ID">
    <button onclick="track()">Track Shipment</button>

    <div id="result"></div>

    <div class="footer">
      Fast • Secure • Reliable
    </div>

  </div>

  <script>
    function formatDate(isoString) {
      if (!isoString) return "";
      const date = new Date(isoString);
      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function track() {
      let id = document.getElementById("trackingId").value.trim();
      const result = document.getElementById("result");

      if (!id) {
        result.innerHTML = "<p class='error'>Please enter a Tracking ID</p>";
        return;
      }

      id = id.toUpperCase();
      result.innerHTML = "Tracking shipment...";

      fetch("YOUR_API_URL?trackingId=" + encodeURIComponent(id))
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            result.innerHTML = "<p class='error'>" + data.error + "</p>";
            return;
          }

          let html = `
            <div class="status-box">
              <div class="status">📦 ${data.shipment.currentStatus}</div>
              <div><b>📍 Location:</b> ${data.shipment.currentLocation}</div>
              <div><b>⏱ Last Updated:</b> ${formatDate(data.shipment.lastUpdated)}</div>
            </div>

            <h4>📜 Tracking History</h4>
            <ul class="history">
          `;

          data.history.forEach(h => {
            html += `
              <li>
                ${formatDate(h.updatedAt)} –
                <b>${h.status}</b> (${h.location})
              </li>
            `;
          });

          html += "</ul>";
          result.innerHTML = html;
        })
        .catch(() => {
          result.innerHTML = "<p class='error'>Unable to fetch tracking information.</p>";
        });
    }
  </script>

</body>
</html>
