<!DOCTYPE html>
<html>
<head>
  <title>Track Shipment | Super Air Express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== HEADER / MENU ===== -->
<header>
  <nav>
    <div class="brand">Super Air Express</div>
    <div>
      <a href="index.html">Home</a>
      <a href="track.html">Track</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<!-- ===== HERO ===== -->
<div class="page-hero">
  <h1>Track Your Shipment</h1>
  <p>Get real-time updates for your consignments</p>
</div>

<!-- ===== TRACKING BOX ===== -->
<div class="track-box">
  <h2>Enter Tracking ID</h2>

  <input
    type="text"
    id="trackingId"
    placeholder="Enter Tracking ID"
    style="text-transform: uppercase;"
  >
  <button onclick="track()">Track</button>

  <div id="result" style="margin-top:20px;"></div>
</div>

<!-- ===== FOOTER ===== -->
<footer>
  © Super Air Express • Fast • Secure • Reliable
</footer>

<!-- ===== SCRIPT ===== -->
<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbxAiGwv_Bs9-FMw5xaG183Ug3rQwJSCRkgh81-wIhSFFrdOAUhwChfyd002EBebb1v9xA/exec";

/* Status → progress */
function getProgress(status) {
  status = status.toLowerCase();
  if (status.includes("picked")) return 25;
  if (status.includes("transit")) return 50;
  if (status.includes("out")) return 75;
  if (status.includes("deliver")) return 100;
  return 10;
}

/* MAIN TRACK FUNCTION */
function track() {
  const input = document.getElementById("trackingId");
  const result = document.getElementById("result");

  const id = input.value.trim().toUpperCase();
  if (!id) {
    result.innerHTML = "<b>Please enter a Tracking ID</b>";
    return;
  }

  result.innerHTML = "Fetching tracking details...";

  fetch(API_URL + "?trackingId=" + encodeURIComponent(id))
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        result.innerHTML = "<b>" + data.error + "</b>";
        return;
      }

      const progress = getProgress(data.shipment.currentStatus);

      let html = `
        <div class="card slide-up fade-in">
          <h3>📦 Status: ${data.shipment.currentStatus}</h3>
          <p>📍 <b>Current Location:</b> ${data.shipment.currentLocation}</p>
          <p>⏱ <b>Last Updated:</b> ${data.shipment.lastUpdated}</p>

          <div style="margin:20px 0;">
            <div style="display:flex; justify-content:space-between; font-size:12px;">
              <span>Picked</span>
              <span>Transit</span>
              <span>Out</span>
              <span>Delivered</span>
            </div>
            <div style="height:8px; background:#e0e0e0; border-radius:6px; overflow:hidden;">
              <div style="
                height:100%;
                width:${progress}%;
                background:linear-gradient(90deg,#0078d7,#00b4ff);
                transition:width 0.6s ease;">
              </div>
            </div>
          </div>

          <h4>Tracking History</h4>
          <ul>
      `;

      data.history.forEach(h => {
        html += `<li>${h.updatedAt} – ${h.status} (${h.location})</li>`;
      });

      html += `
          </ul>
        </div>
      `;

      result.innerHTML = html;
    })
    .catch(() => {
      result.innerHTML = "<b>Error fetching tracking details</b>";
    });
}

/* AUTO-TRACK WHEN ID IS IN URL */
document.addEventListener("DOMContentLoaded", function () {
  const params = new URLSearchParams(window.location.search);
  const idFromURL = params.get("id");

  if (idFromURL) {
    const input = document.getElementById("trackingId");
    input.value = idFromURL.toUpperCase();

    // ensure everything is ready
    setTimeout(() => {
      track();
    }, 100);
  }
});
</script>

</body>
</html>
