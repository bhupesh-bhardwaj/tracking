<!DOCTYPE html>
<html>
<head>
  <title>Track Shipment | Super Air Express</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <nav>
    <a href="index.html">Home</a>
    <a href="track.html">Track</a>
    <a href="services.html">Services</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h2>Track Your Shipment</h2>

  <input type="text" id="trackingId" placeholder="Enter Tracking ID" style="text-transform:uppercase">
  <button onclick="track()">Track</button>

  <div id="result"></div>

  <div class="footer">Super Air Express</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxAiGwv_Bs9-FMw5xaG183Ug3rQwJSCRkgh81-wIhSFFrdOAUhwChfyd002EBebb1v9xA/exec";

function formatDate(d) {
  return new Date(d).toLocaleString("en-IN", {
    day:"2-digit", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit", hour12:true
  });
}

function track() {
  let id = document.getElementById("trackingId").value.trim().toUpperCase();
  let result = document.getElementById("result");

  if (!id) {
    result.innerHTML = "Please enter Tracking ID";
    return;
  }

  fetch(https://script.google.com/macros/s/AKfycbxAiGwv_Bs9-FMw5xaG183Ug3rQwJSCRkgh81-wIhSFFrdOAUhwChfyd002EBebb1v9xA/exec + "?trackingId=" + id)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        result.innerHTML = data.error;
        return;
      }

      let html = `<h3>Status: ${data.shipment.currentStatus}</h3>
                  <p>Location: ${data.shipment.currentLocation}</p>
                  <p>Last Updated: ${formatDate(data.shipment.lastUpdated)}</p>
                  <h4>History</h4><ul>`;

      data.history.forEach(h => {
        html += `<li>${formatDate(h.updatedAt)} – ${h.status} (${h.location})</li>`;
      });

      html += "</ul>";
      result.innerHTML = html;
    });
}
</script>

</body>
</html>
